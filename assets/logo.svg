<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Perplexity Auto Creator logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13233d"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20808D"/>
      <stop offset="1" stop-color="#4dd0e1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#1f3b5c" stroke-width="2"/>

  <!-- orbit rings -->
  <g opacity="0.55" stroke="url(#g1)" fill="none" stroke-width="3">
    <circle cx="256" cy="248" r="150" stroke-dasharray="10 16"/>
    <circle cx="256" cy="248" r="112" stroke-dasharray="6 14" opacity="0.8"/>
  </g>

  <!-- node / agent core -->
  <g filter="url(#glow)">
    <path d="M256 138c-30 0-52 22-52 52v26l-34 20c-10 6-10 20 0 26l34 20v26c0 30 22 52 52 52h0c30 0 52-22 52-52v-26l34-20c10-6 10-20 0-26l-34-20v-26c0-30-22-52-52-52z"
          fill="url(#g1)"/>
  </g>
  <circle cx="256" cy="248" r="34" fill="#0b1220"/>
  <circle cx="256" cy="248" r="20" fill="url(#g2)"/>

  <!-- satellite dots -->
  <g fill="#4dd0e1">
    <circle cx="256" cy="98" r="12"/>
    <circle cx="406" cy="248" r="12" fill="#ffb454"/>
    <circle cx="256" cy="398" r="12"/>
    <circle cx="106" cy="248" r="12" fill="#ffb454"/>
  </g>

  <!-- spark / auto bolt -->
  <g transform="translate(360 360)" filter="url(#glow)">
    <path d="M18 0 4 34h14l-6 30 26-40H24l8-24z" fill="#ffd479"/>
  </g>
</svg>
